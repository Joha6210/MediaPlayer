# yaml-language-server: $schema=https://goreleaser.com
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

# Globale hooks (Her må kun stå simple tekst-strenge)
before:
  hooks:
    - go mod tidy
    - npm install --prefix ui
    - npm run build --prefix ui

builds:
  - id: mediaplayer-server
    env:
      - CGO_ENABLED=0
    dir: ./backend               # Kør 'go build' inde fra backend mappen
    main: ./cmd/mediaplayer   # Sti relativ til 'dir'
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    files:
      - backend/config/*.yaml
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: mediaplayer
    package_name: mediaplayer
    vendor: MediaPlayer
    maintainer: MediaPlayer maintainers
    description: Raspberry Pi media player with an embedded web UI
    license: MIT
    formats:
      - deb
    contents:
      - src: backend/config/default.yaml
        dst: /etc/mediaplayer/default.yaml
        type: config
      - src: deploy/systemd/mediaplayer-mpv.service
        dst: /etc/systemd/system/mediaplayer-mpv.service
      - src: deploy/systemd/mediaplayer-backend.service
        dst: /etc/systemd/system/mediaplayer-backend.service
      - src: deploy/systemd/mediaplayer-kiosk.service
        dst: /etc/systemd/system/mediaplayer-kiosk.service
      - src: deploy/pipewire/wireplumber-bluetooth.lua.d/51-mediaplayer-policy.lua
        dst: /etc/wireplumber/wireplumber.conf.d/51-mediaplayer-policy.lua
    scripts:
      postinstall: scripts/package-postinstall.sh

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"